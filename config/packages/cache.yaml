framework:
    cache:
        # Unique name of your app: used to compute stable namespaces for cache keys.
        prefix_seed: app/todo_list

        # Пулы кэша с Redis
        pools:
            # Основной пул кэша приложения
            cache.redis:
                adapter: cache.adapter.redis
                provider: '%env(resolve:REDIS_URL)%'
                default_lifetime: 3600 # 1 час

            # Пул для аналитики (30 минут)
            cache.analytics:
                adapter: cache.adapter.redis
                provider: '%env(resolve:REDIS_URL)%'
                default_lifetime: 1800

            # Пул для пользовательских данных (15 минут)
            cache.user_data:
                adapter: cache.adapter.redis
                provider: '%env(resolve:REDIS_URL)%'
                default_lifetime: 900

            # Пул для статистики (10 минут)
            cache.statistics:
                adapter: cache.adapter.redis
                provider: '%env(resolve:REDIS_URL)%'
                default_lifetime: 600

            # Пул для сессий (2 часа)
            cache.sessions:
                adapter: cache.adapter.redis
                provider: '%env(resolve:REDIS_URL)%'
                default_lifetime: 7200

# Production: Redis для app и system кэша
when@prod:
    framework:
        cache:
            app: cache.adapter.redis
            system: cache.adapter.redis
            default_redis_provider: '%env(resolve:REDIS_URL)%'

# Development: файловый кэш для отладки
when@dev:
    framework:
        cache:
            app: cache.adapter.filesystem
            system: cache.adapter.filesystem

# Testing: in-memory кэш для скорости
when@test:
    framework:
        cache:
            app: cache.adapter.array
            system: cache.adapter.array
